name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/build-mac.yml"

jobs:
  build-mac:
    runs-on: macos-latest   # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build bundled gallery-dl executable
        run: |
          pyinstaller --onefile --console --name gallery-dl gallery_dl_cli.py
          chmod +x dist/gallery-dl

      - name: Build app bundle
        run: |
          pyinstaller --onefile --windowed --name "坤坤下载器" \
            --add-binary "dist/gallery-dl:." \
            main.py
          codesign --force --deep --sign - "dist/坤坤下载器.app"

      - name: Package for download
        run: |
          cd dist
          rm -f gallery-dl   # 不要打包中间产物
          ditto -c -k --keepParent "坤坤下载器.app" "坤坤下载器-mac.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kunkun-downloader-mac-arm64
          path: "dist/坤坤下载器-mac.zip"
